<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sustainability portfolio" />
  <title>Sustainability Portfolio</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-emerald-50 text-emerald-900 antialiased">
  <main class="text-center px-4">
    <h1 class="text-5xl font-bold tracking-tight">Hello World</h1>
    <p class="mt-4 text-lg text-emerald-700">Tailwind CSS is working.</p>
    <p id="js-status" class="mt-2 text-sm text-emerald-600">JavaScript not loaded.</p>
    <p class="custom-css-check mt-2 text-sm">Custom CSS not loaded.</p>
  </main>

  <script>
    document.getElementById('js-status').textContent = 'JavaScript is working.';
  </script>
</body>
</html>
